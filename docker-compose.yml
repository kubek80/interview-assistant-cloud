# Run the hosted Interview Assistant on your own computer with Docker. For trying it out only: it
# uses the development sign-in (no Google account) and a database with no password. Never use this
# file for real candidate data or in production (see docs/deploy/README.md).
#
# Windows: double-click start-local.bat (and stop-local.bat to stop).
# Any system:
#
#     docker compose up -d --build
#
#   then open http://localhost:8080 and follow "How to sign in here" on the sign-in screen.
#   The first start takes a few minutes. Test users: admin@, organiser@, interviewer@ and
#   reviewer@example.test. To be several people at once, sign in as different users in a private
#   window or another browser profile. Use "localhost" in the address, not 127.0.0.1.
#
# Stop (keeps your data):     docker compose down
# Stop and delete all data:   docker compose down -v
# After pulling new code:     docker compose up -d --build
#
# Developing with Node.js on your machine instead: start only the database with
# "docker compose up -d db" and follow "Development quick start" in README.md (skip "npm run db:start").

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ia
      POSTGRES_DB: ia_dev
      # No password: the port below is published on this computer only (127.0.0.1).
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia -d ia_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: local.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ia@db:5432/ia_dev
      SESSION_SECRET: local-docker-only-not-a-secret-0123456789abcdef
      PUBLIC_URL: http://localhost:8080
      BOOTSTRAP_ADMINS: admin@example.test
      DEV_SIGN_IN: "true"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  db-data:
