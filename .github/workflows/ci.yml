name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # HOST-8: server and end-to-end tests run against a real PostgreSQL.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ia
          POSTGRES_PASSWORD: ia
          POSTGRES_DB: ia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ia:ia@localhost:5432/ia_test
      DATABASE_URL: postgres://ia:ia@localhost:5432/ia_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # BANK-3: the bundled track files are valid.
      - name: Validate seed
        run: npm run validate:seed

      # HOST-4: migrations apply to an empty database, and a second run applies nothing.
      - name: Migrate a fresh database twice, seed twice
        run: |
          psql "$TEST_DATABASE_URL" -c 'CREATE DATABASE ia_ci'
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
          npm run db:seed

      - name: Typecheck (browser and server)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Server tests (PostgreSQL)
        run: npm run test:server

      # E2E builds the app itself (npm run build) before starting the server.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload end-to-end results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  docker:
    # HOST-2: the container image builds. (Pushing and deploying are in docs/deploy.)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag interview-assistant:ci .
      - name: The image starts and refuses to run without its settings
        run: |
          out=$(docker run --rm -e NODE_ENV=production interview-assistant:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Interview Assistant cannot start"
      - name: The image runs as a non-root user
        run: test "$(docker inspect --format '{{.Config.User}}' interview-assistant:ci)" = "nonroot"
